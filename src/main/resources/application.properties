spring.application.name=sistema-cursos-springboot
#Configuracion para base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/db_cursos_relationship
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
#Estableciendo el encoding para tildes y textos latinoamericanos
spring.messages.encoding=UTF-8
#Evitamos conflictos con templates estaticos cuando ocurre un error.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false